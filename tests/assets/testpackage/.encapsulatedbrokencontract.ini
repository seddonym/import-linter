[importlinter]
root_package = testpackage

[importlinter:contract:outbound]
name=Expected broken encapsulated contract (imports out of the modules)
; This should fail, as high.blue.one -> utils, high.blue.one -> indirect.yellow and
; high.blue.two -> indirect.brown.
type=encapsulated
modules=
    testpackage.high.blue

[importlinter:contract:inbound]
name=Expected broken encapsulated contract (imports into the modules)
; This should fail, as utils, indirect.brown and indirect.yellow import high.green.
type=encapsulated
modules=
    testpackage.high.green
