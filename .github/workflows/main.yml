---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test under supported Python versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Test
        run: just test-all

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Lint
        run: just lint

      - name: Drawgraph smoke test
        run: uv run import-linter drawgraph importlib

  smoke_test:
    name: Smoke test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # We run this already for ubuntu-latest in the lint action.
        os: [ macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v10.3.3

      - name: Smoke test lint-imports
        run: uv run lint-imports

      - name: Smoke test import-linter alias
        run: uv run import-linter lint

      - name: Smoke test import-linter drawgraph
        run: uv run import-linter drawgraph importlib

  docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build docs
        run: just build-docs

  benchmarks:
    name: Benchmarks
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04

    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv and set the latest supported Python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: just benchmark-ci
